services:
  nextory-abs-poc:
    build: .
    container_name: nextory-abs-poc
    env_file:
      - .env
    environment:
      NEXTORY_USERNAME: "${NEXTORY_USERNAME:?Set NEXTORY_USERNAME in .env}"
      NEXTORY_PASSWORD: "${NEXTORY_PASSWORD:?Set NEXTORY_PASSWORD in .env}"
      TEST_PASSWORD: "${TEST_PASSWORD:?Set TEST_PASSWORD in .env}"
      PROGRESS_FILE: /state/progress.json
    volumes:
      - type: volume
        source: nextory-progress
        target: /state
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-13378}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
volumes:
  nextory-progress:
